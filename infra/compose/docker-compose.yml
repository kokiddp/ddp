# DDP local development infrastructure
# Usage: docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env up -d

x-appwrite-env: &appwrite-env
  _APP_ENV: ${_APP_ENV:-development}
  _APP_WORKER_PER_CORE: 6
  _APP_LOCALE: en
  _APP_CONSOLE_WHITELIST_ROOT: enabled
  _APP_CONSOLE_WHITELIST_EMAILS:
  _APP_CONSOLE_WHITELIST_IPS:
  _APP_SYSTEM_EMAIL_NAME: DDP Dev
  _APP_SYSTEM_EMAIL_ADDRESS: noreply@localhost
  _APP_SYSTEM_RESPONSE_FORMAT:
  _APP_OPTIONS_ABUSE: disabled
  _APP_OPTIONS_FORCE_HTTPS: disabled
  _APP_OPENSSL_KEY_V1: ${_APP_OPENSSL_KEY_V1:-ddp-dev-openssl-key-change-in-prod}
  _APP_DOMAIN: localhost
  _APP_DOMAIN_TARGET: localhost
  _APP_DOMAIN_FUNCTIONS: functions.localhost
  _APP_REDIS_HOST: redis
  _APP_REDIS_PORT: 6379
  _APP_DB_HOST: mariadb
  _APP_DB_PORT: 3306
  _APP_DB_SCHEMA: appwrite
  _APP_DB_USER: appwrite
  _APP_DB_PASS: ${_APP_DB_PASS:-password}
  _APP_STORAGE_LIMIT: 30000000
  _APP_STORAGE_PREVIEW_LIMIT: 20000000
  _APP_STORAGE_ANTIVIRUS: disabled
  _APP_LOGGING_PROVIDER:
  _APP_LOGGING_CONFIG:

services:
  # ─── Traefik reverse proxy ────────────────────────────────
  traefik:
    image: traefik:2.11
    container_name: ddp-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.constraint-label-stack`,`ddp`)
      - --providers.file.directory=/storage/config
      - --providers.file.watch=true
      - --entrypoints.appwrite_web.address=:80
      - --entrypoints.appwrite_websecure.address=:443
    ports:
      - "${APPWRITE_PORT:-80}:80"
      - "${APPWRITE_SSL_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-config:/storage/config:ro
      - appwrite-certificates:/storage/certificates:ro
    depends_on:
      - appwrite
    networks:
      - appwrite

  # ─── Appwrite ───────────────────────────────────────────────
  appwrite:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=ddp
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_api.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_api_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_api_http.rule=PathPrefix(`/`)
      - traefik.http.routers.appwrite_api_http.service=appwrite_api
      - traefik.http.routers.appwrite_api_https.entrypoints=appwrite_websecure
      - traefik.http.routers.appwrite_api_https.rule=PathPrefix(`/`)
      - traefik.http.routers.appwrite_api_https.service=appwrite_api
      - traefik.http.routers.appwrite_api_https.tls=true
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    environment:
      <<: *appwrite-env
    depends_on:
      - mariadb
      - redis

  appwrite-console:
    image: appwrite/console:5.2.58
    container_name: ddp-appwrite-console
    restart: unless-stopped
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=ddp
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_console.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_console_http.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_console_http.rule=PathPrefix(`/console`)
      - traefik.http.routers.appwrite_console_http.service=appwrite_console
      - traefik.http.routers.appwrite_console_https.entrypoints=appwrite_websecure
      - traefik.http.routers.appwrite_console_https.rule=PathPrefix(`/console`)
      - traefik.http.routers.appwrite_console_https.service=appwrite_console
      - traefik.http.routers.appwrite_console_https.tls=true

  appwrite-realtime:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-realtime
    restart: unless-stopped
    entrypoint: realtime
    networks:
      - appwrite
    labels:
      - traefik.enable=true
      - traefik.constraint-label-stack=ddp
      - traefik.docker.network=appwrite
      - traefik.http.services.appwrite_realtime.loadbalancer.server.port=80
      - traefik.http.routers.appwrite_realtime_ws.entrypoints=appwrite_web
      - traefik.http.routers.appwrite_realtime_ws.rule=PathPrefix(`/v1/realtime`)
      - traefik.http.routers.appwrite_realtime_ws.service=appwrite_realtime
      - traefik.http.routers.appwrite_realtime_wss.entrypoints=appwrite_websecure
      - traefik.http.routers.appwrite_realtime_wss.rule=PathPrefix(`/v1/realtime`)
      - traefik.http.routers.appwrite_realtime_wss.service=appwrite_realtime
      - traefik.http.routers.appwrite_realtime_wss.tls=true
    environment:
      <<: *appwrite-env
    depends_on:
      - mariadb
      - redis

  appwrite-worker-audits:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-audits
    restart: unless-stopped
    entrypoint: worker-audits
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis
      - mariadb

  appwrite-worker-webhooks:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-webhooks
    restart: unless-stopped
    entrypoint: worker-webhooks
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis
      - mariadb

  appwrite-worker-deletes:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-deletes
    restart: unless-stopped
    entrypoint: worker-deletes
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    volumes:
      - appwrite-uploads:/storage/uploads
      - appwrite-cache:/storage/cache
      - appwrite-certificates:/storage/certificates
      - appwrite-functions:/storage/functions
    depends_on:
      - redis
      - mariadb

  appwrite-worker-databases:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-databases
    restart: unless-stopped
    entrypoint: worker-databases
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis
      - mariadb

  appwrite-worker-builds:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-builds
    restart: unless-stopped
    entrypoint: worker-builds
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis
      - mariadb

  appwrite-worker-certificates:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-certificates
    restart: unless-stopped
    entrypoint: worker-certificates
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    volumes:
      - appwrite-config:/storage/config
      - appwrite-certificates:/storage/certificates
    depends_on:
      - redis
      - mariadb

  appwrite-worker-mails:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-mails
    restart: unless-stopped
    entrypoint: worker-mails
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis

  appwrite-worker-messaging:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-worker-messaging
    restart: unless-stopped
    entrypoint: worker-messaging
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis

  appwrite-maintenance:
    image: appwrite/appwrite:1.6
    container_name: ddp-appwrite-maintenance
    restart: unless-stopped
    entrypoint: maintenance
    networks:
      - appwrite
    environment:
      <<: *appwrite-env
    depends_on:
      - redis
      - mariadb

  # ─── Appwrite dependencies ─────────────────────────────────
  mariadb:
    image: mariadb:10.11
    container_name: ddp-mariadb
    restart: unless-stopped
    networks:
      - appwrite
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: appwrite
      MYSQL_USER: appwrite
      MYSQL_PASSWORD: ${_APP_DB_PASS:-password}
    command: >
      mysqld
      --innodb-flush-method=fsync
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ddp-redis
    restart: unless-stopped
    networks:
      - appwrite
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

  # ─── LiveKit ────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.9
    container_name: ddp-livekit
    restart: unless-stopped
    ports:
      - "${LIVEKIT_PORT:-7880}:7880"
      - "7881:7881"
      - "7882:7882/udp"
    command: --config /etc/livekit.yaml --dev
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

networks:
  appwrite:
    name: appwrite

volumes:
  appwrite-uploads:
  appwrite-cache:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  mariadb-data:
  redis-data:
